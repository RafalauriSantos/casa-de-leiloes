name: ci

# Runs on pull requests, pushes to main, and manual workflow_dispatch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On main (pushes, merges and dispatches), always run the full test suite.
      # On pull requests, skip the test run only if the change touches exclusively docs/markdown.
      - id: scope
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Running full CI suite for main branch"
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full CI suite for manual dispatch"
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha || 'origin/main' }}" HEAD -- . ':!docs' ':!*.md' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: Start local Supabase (real Postgres and Auth)
        if: steps.scope.outputs.code == 'true'
        run: npx supabase start
      - name: make ci
        if: steps.scope.outputs.code == 'true'
        run: make ci
      - name: Docs only, nothing to test
        if: steps.scope.outputs.code == 'false'
        run: 'echo "Only docs changed: the test run is skipped."'
